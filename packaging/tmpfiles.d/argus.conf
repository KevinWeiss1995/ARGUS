# Runtime directory (cleared on reboot)
d /run/argus 0755 root root -

# Persistent state directory
d /var/lib/argus 0750 root root -

# Scheduler audit log (created on first scheduler action). Permissions
# locked down so a multi-user host can't read which jobs argusd drained.
# Size-capped rotation goes through logrotate; the RPM ships
# /etc/logrotate.d/argus to handle that.
f /var/lib/argus/scheduler-audit.jsonl 0640 root root - -
