---
# Install or upgrade the ARGUS RPM, manage config, and optionally load
# the SELinux policy module.

- name: Stage RPM locally on each node
  ansible.builtin.copy:
    src: "{{ argus_rpm_source }}"
    dest: /tmp/argus.rpm
    mode: "0644"
  when: argus_rpm_source is regex('^[/.~]')

- name: Determine RPM location on node
  ansible.builtin.set_fact:
    argus_rpm_path: >-
      {% if argus_rpm_source is regex('^https?://') %}{{ argus_rpm_source }}{% else %}/tmp/argus.rpm{% endif %}

- name: Install / upgrade argus package
  ansible.builtin.dnf:
    name: "{{ argus_rpm_path }}"
    state: present
    disable_gpg_check: "{{ argus_disable_gpg_check | default(true) }}"
  notify: restart argusd

- name: Ensure /etc/argus exists
  ansible.builtin.file:
    path: /etc/argus
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render /etc/argus/argusd.conf
  ansible.builtin.template:
    src: argusd.conf.j2
    dest: /etc/argus/argusd.conf
    owner: root
    group: root
    mode: "0640"
  notify: restart argusd

- name: Render /etc/argus/argusd.toml
  ansible.builtin.template:
    src: argusd.toml.j2
    dest: /etc/argus/argusd.toml
    owner: root
    group: root
    mode: "0640"
  notify: restart argusd

- name: Stage TLS materials when configured
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ argus_tls_files | default([]) }}"
  when: argus_tls_cert_path != ''
  notify: restart argusd

# --- Optional fine-grained capabilities drop-in ---
# Activate the modern-caps drop-in only when:
#   - The host is NOT RHEL 8 (systemd 239 doesn't understand CAP_BPF), AND
#   - Kernel >= 5.8, OR the operator explicitly forced it via argus_force_modern_caps.
# Otherwise the default unit (CAP_SYS_ADMIN) is used — works everywhere
# including the user's RHEL 8.10 stock kernel.

- name: Detect RHEL 8 from kernel release
  ansible.builtin.set_fact:
    argus_is_rhel8: "{{ '.el8' in ansible_kernel }}"

- name: Decide whether to enable fine-grained caps drop-in
  ansible.builtin.set_fact:
    argus_use_modern_caps: >-
      {{ (argus_force_modern_caps | default(false))
         or ((not argus_is_rhel8)
             and (ansible_kernel.split('.')[0] | int > 5
                  or (ansible_kernel.split('.')[0] | int == 5
                      and ansible_kernel.split('.')[1].split('-')[0] | int >= 8))) }}

- name: Install modern-caps drop-in when appropriate
  when: argus_use_modern_caps | bool
  block:
    - name: Ensure argusd.service.d exists
      ansible.builtin.file:
        path: /etc/systemd/system/argusd.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy modern-caps drop-in from RPM's staging location
      ansible.builtin.copy:
        src: /usr/share/argus/systemd/modern-caps.conf
        dest: /etc/systemd/system/argusd.service.d/modern-caps.conf
        owner: root
        group: root
        mode: "0644"
        remote_src: true
      notify: restart argusd

- name: Remove modern-caps drop-in on RHEL 8 hosts (failsafe)
  ansible.builtin.file:
    path: /etc/systemd/system/argusd.service.d/modern-caps.conf
    state: absent
  when: argus_is_rhel8 and not (argus_force_modern_caps | default(false))
  notify: restart argusd

# --- Optional SELinux policy load (opt-in, post-install) ---
# Mirrors the SLURM pattern: ARGUS imposes no SELinux dep, the policy
# source files are shipped with the main RPM, and operators opt in
# fleet-wide via this var. Hosts that don't run SELinux are unaffected
# either way — `argus-selinux-enable` refuses to run on Disabled hosts.

- name: Enable argus SELinux policy on Enforcing/Permissive hosts
  when: argus_install_selinux | bool
  block:
    - name: Ensure SELinux policy build tools are installed
      ansible.builtin.dnf:
        name:
          - selinux-policy-devel
          - policycoreutils-python-utils
        state: present

    - name: Run argus-selinux-enable
      ansible.builtin.command: /usr/bin/argus-selinux-enable
      register: argus_selinux_enable
      changed_when: "'Policy module loaded' in argus_selinux_enable.stdout"
      # Tolerate the Disabled-host case: the script exits non-zero and
      # we don't want to fail the play on a misconfigured group var.
      failed_when:
        - argus_selinux_enable.rc != 0
        - "'SELinux is Disabled' not in argus_selinux_enable.stderr"
