; Example inventory for an HPC cluster running ARGUS.
;
; Adjust the group name, host count, and any per-host overrides as needed.
; Use `ansible-inventory -i inventory.ini --list` to validate.

[argus_nodes]
node[01:32].cluster.example.org

[argus_nodes:vars]
ansible_user=ansible
ansible_become_method=sudo

; Per-cluster overrides go in group_vars/argus_nodes.yml or group_vars/all.yml.
