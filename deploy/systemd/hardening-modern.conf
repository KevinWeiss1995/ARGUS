# Optional extra-hardening drop-in for argusd.service, for sites running
# systemd 241+ (RHEL 9, Ubuntu 22+, Fedora 38+, modern Debian, etc.).
#
# Rocky 8 ships systemd 239, which doesn't recognize these directives
# and emits "Unknown lvalue" warnings on every daemon-reload. Keeping
# them out of the main unit eliminates that noise; sites that can use
# the extra protection drop this file in explicitly:
#
#   sudo mkdir -p /etc/systemd/system/argusd.service.d/
#   sudo cp /usr/share/argus/systemd/hardening-modern.conf \
#       /etc/systemd/system/argusd.service.d/hardening-modern.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart argusd
#
# To verify which version of systemd you have:
#   systemctl --version | head -1
# 241 or newer means safe to deploy this drop-in.

[Service]
# systemd 244+
ProtectKernelLogs=yes
# systemd 245+
ProtectClock=yes
# systemd 241+
ProtectHostname=yes
# systemd 247+
ProtectProc=invisible
