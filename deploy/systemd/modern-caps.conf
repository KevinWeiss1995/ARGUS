# Fine-grained capability drop-in for argusd.service.
#
# Copy to /etc/systemd/system/argusd.service.d/modern-caps.conf on hosts
# that meet ALL of the following:
#
#   - Kernel >= 5.8 with CAP_BPF / CAP_PERFMON present
#       (RHEL 8.5+ backports both; check with: grep CAP_BPF /usr/include/linux/capability.h)
#   - systemd >= 247 that recognizes the CAP_BPF / CAP_PERFMON names
#       (RHEL 9 has it; RHEL 8 does NOT — leave the default CAP_SYS_ADMIN)
#
# Switching to fine-grained caps reduces blast radius if argusd is exploited:
# instead of CAP_SYS_ADMIN (which grants ~30 capabilities worth of access),
# the agent holds only the specific bits it needs.
#
# To activate:
#   sudo mkdir -p /etc/systemd/system/argusd.service.d/
#   sudo cp /usr/share/argus/systemd/modern-caps.conf \
#       /etc/systemd/system/argusd.service.d/modern-caps.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart argusd
#   journalctl -u argusd | grep "effective capabilities"   # verify
#
# To revert: rm the drop-in file and daemon-reload + restart.

[Service]
# Clear the inherited CAP_SYS_ADMIN values, then set the fine-grained set.
# Empty = means "reset the list" in systemd unit syntax.
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_BPF CAP_PERFMON CAP_SYSLOG CAP_DAC_READ_SEARCH
AmbientCapabilities=
AmbientCapabilities=CAP_BPF CAP_PERFMON CAP_SYSLOG CAP_DAC_READ_SEARCH
